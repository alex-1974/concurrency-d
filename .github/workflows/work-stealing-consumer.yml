name: Work-stealing consumer gate

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "research/**"
      - "docs/research/**"
      - "tools/research/**"
      - "dub.sdl"
      - ".gitattributes"
      - "LICENSE"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "tools/validation/m0_package.py"
      - "source/concurrency/**"
      - "tests/public_api/**"
      - "examples/cpu-executor/**"
      - "examples/event-loop-consumer/**"
      - "examples/nested-scopes/**"
      - "docs/EXECUTOR.md"
      - "docs/adr/**"
      - "docs/V0.3-RELEASE-QUALIFICATION.md"
      - "benchmarks/end-to-end/**"
      - "benchmarks/adaptive-ranges/**"
      - "benchmarks/streaming/**"
      - "benchmarks/cross-language/**"
      - "benchmarks/README.md"
      - "tools/validation/summarize_m2_benchmark.py"
      - "tools/validation/summarize_streaming_benchmark.py"
      - "tools/validation/capture_m2_benchmark.py"
      - ".github/workflows/m2-performance-capture.yml"
      - "tools/validation/m0_public_api.py"
      - "tools/validation/m0_public_path.py"
      - "tests/lifecycle/**"
      - "tools/validation/m0_lifecycle.py"
      - "benchmarks/parking/**"
      - "benchmarks/executor/**"
      - "benchmarks/storage/**"
      - "benchmarks/owned-storage/**"
      - "benchmarks/scopes/**"
      - "benchmarks/fork-join/**"
      - ".github/workflows/work-stealing-consumer.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "research/**"
      - "docs/research/**"
      - "tools/research/**"
      - "dub.sdl"
      - ".gitattributes"
      - "LICENSE"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "tools/validation/m0_package.py"
      - "source/concurrency/**"
      - "tests/public_api/**"
      - "examples/cpu-executor/**"
      - "examples/event-loop-consumer/**"
      - "examples/nested-scopes/**"
      - "docs/EXECUTOR.md"
      - "docs/adr/**"
      - "docs/V0.3-RELEASE-QUALIFICATION.md"
      - "benchmarks/end-to-end/**"
      - "benchmarks/adaptive-ranges/**"
      - "benchmarks/streaming/**"
      - "benchmarks/cross-language/**"
      - "benchmarks/README.md"
      - "tools/validation/summarize_m2_benchmark.py"
      - "tools/validation/summarize_streaming_benchmark.py"
      - "tools/validation/capture_m2_benchmark.py"
      - ".github/workflows/m2-performance-capture.yml"
      - "tools/validation/m0_public_api.py"
      - "tools/validation/m0_public_path.py"
      - "tests/lifecycle/**"
      - "tools/validation/m0_lifecycle.py"
      - "benchmarks/parking/**"
      - "benchmarks/executor/**"
      - "benchmarks/storage/**"
      - "benchmarks/owned-storage/**"
      - "benchmarks/scopes/**"
      - "benchmarks/fork-join/**"
      - ".github/workflows/work-stealing-consumer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Consumer / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install D
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0

      - name: Versions
        shell: bash
        run: |
          "$DC" --version
          dub --version

      - name: Unit tests
        shell: bash
        run: dub test --compiler="$DC" --force

      - name: M0 lifecycle and isolated native-failure boundary
        shell: bash
        run: python3 tools/validation/m0_lifecycle.py "$DC"

      - name: Public executor consumers and compile-negative contract
        shell: bash
        run: python3 tools/validation/m0_public_api.py "$DC"

      - name: Event-loop consumer handoff smoke
        shell: bash
        run: dub run --root=examples/event-loop-consumer --compiler="$DC" --build=release --force

      - name: Exported package consumer
        run: python3 tools/validation/m0_package.py "$DC"

      - name: Release build
        shell: bash
        run: dub build --build=release --compiler="$DC" --force

      - name: Public Ddoc generation
        shell: bash
        run: dub build --build=docs --compiler="$DC" --force

      - name: Same-work public/internal executor smoke (no timing threshold)
        shell: bash
        run: |
          dub build --root=benchmarks/executor --build=release --compiler="$DC" --force
          ./benchmarks/executor/concurrency-executor-benchmark internal 4 4 1024
          ./benchmarks/executor/concurrency-executor-benchmark public 4 4 1024
          ./benchmarks/executor/concurrency-executor-benchmark internal 4 4 64 2048
          ./benchmarks/executor/concurrency-executor-benchmark public 4 4 64 2048

      - name: Task-record storage reuse smoke (no timing threshold)
        shell: bash
        run: dub run --root=benchmarks/storage --build=release --compiler="$DC" --force -- 257 2 2 3 2

      - name: Public owned-storage and GC retention smoke (no timing threshold)
        shell: bash
        run: dub run --root=benchmarks/owned-storage --build=release --compiler="$DC" --force -- 64 2 1

      - name: TaskScope versus submit/get smoke (no timing threshold)
        shell: bash
        run: dub run --root=benchmarks/scopes --build=release --compiler="$DC" --force -- 32 2 32 2 1

      - name: Two-way fork-join smoke (no timing threshold)
        shell: bash
        run: dub run --root=benchmarks/fork-join --build=release --compiler="$DC" --force -- 16 2 32 2 1

      - name: End-to-end scheduler comparison smoke (no timing threshold)
        shell: bash
        run: |
          dub build --root=benchmarks/end-to-end --build=release --compiler="$DC" --force
          ./benchmarks/end-to-end/concurrency-end-to-end-benchmark 4 2 1 128 > /tmp/end-to-end.csv
          python3 tools/validation/summarize_m2_benchmark.py /tmp/end-to-end.csv > /dev/null

      - name: Adaptive range scheduling smoke (no timing threshold)
        shell: bash
        run: |
          dub build --root=benchmarks/adaptive-ranges --build=release --compiler="$DC" --force
          ./benchmarks/adaptive-ranges/concurrency-adaptive-ranges-benchmark 1 0 > /dev/null

      - name: Bounded streaming comparison smoke (no timing threshold)
        shell: bash
        run: |
          dub build --root=benchmarks/streaming --build=release --compiler="$DC" --force
          ./benchmarks/streaming/concurrency-streaming-benchmark 4 2 8 128 64 1 1 0 > /tmp/streaming.csv
          python3 tools/validation/summarize_streaming_benchmark.py /tmp/streaming.csv > /dev/null

      - name: Portable parking smoke and metrics (not a fixed performance gate)
        shell: bash
        run: dub run --root=benchmarks/parking --build=release --compiler="$DC" --force -- 2 64

  cross-language-reference:
    name: Cross-language benchmark references (checksum smoke)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify toolchains
        run: |
          cmake --version
          c++ --version
          rustc --version
          cargo --version

      - name: Build pinned Taskflow and oneTBB adapters
        run: |
          cmake -S benchmarks/cross-language -B /tmp/cross-language-build \
            -DCMAKE_BUILD_TYPE=Release -DTF_BUILD_TESTS=OFF \
            -DTF_BUILD_EXAMPLES=OFF -DTBB_TEST=OFF
          cmake --build /tmp/cross-language-build \
            --target taskflow_reference onetbb_reference --parallel 2

      - name: Build pinned Rayon adapter
        run: cargo build --locked --manifest-path benchmarks/cross-language/rayon/Cargo.toml --release

      - name: Run checksum-verified multi-wave reference smoke
        run: |
          /tmp/cross-language-build/taskflow_reference 4 2 1 2 8 > /tmp/taskflow-reference.csv
          /tmp/cross-language-build/onetbb_reference 4 2 1 2 8 > /tmp/onetbb-reference.csv
          benchmarks/cross-language/rayon/target/release/rayon-reference 4 2 1 2 8 > /tmp/rayon-reference.csv
          python3 - <<'PY'
          import csv
          for path in ("/tmp/taskflow-reference.csv", "/tmp/onetbb-reference.csv", "/tmp/rayon-reference.csv"):
              with open(path, newline="") as stream:
                  rows = list(csv.DictReader(stream))
              assert rows and all(row["checksum"] for row in rows), path
          PY

  native-arm64:
    name: Consumer / native ARM64 / LDC 1.41
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.41.0

      - name: Platform evidence
        shell: bash
        run: |
          "$DC" --version
          dub --version
          uname -a
          uname -m
          lscpu
          test "$(uname -m)" = "aarch64"

      - name: Unit tests
        shell: bash
        run: dub test --compiler="$DC" --force

      - name: M0 lifecycle and isolated native-failure boundary
        shell: bash
        run: python3 tools/validation/m0_lifecycle.py "$DC"

      - name: Public executor consumers and compile-negative contract
        shell: bash
        run: python3 tools/validation/m0_public_api.py "$DC"

      - name: Event-loop consumer handoff smoke
        shell: bash
        run: dub run --root=examples/event-loop-consumer --compiler="$DC" --build=release --force

      - name: Exported package consumer
        run: python3 tools/validation/m0_package.py "$DC"

      - name: Release build
        shell: bash
        run: dub build --build=release --compiler="$DC" --force

      - name: Public Ddoc generation
        shell: bash
        run: dub build --build=docs --compiler="$DC" --force

      - name: Same-work public/internal executor smoke (no timing threshold)
        shell: bash
        run: |
          dub build --root=benchmarks/executor --build=release --compiler="$DC" --force
          ./benchmarks/executor/concurrency-executor-benchmark internal 4 4 1024
          ./benchmarks/executor/concurrency-executor-benchmark public 4 4 1024
          ./benchmarks/executor/concurrency-executor-benchmark internal 4 4 64 2048
          ./benchmarks/executor/concurrency-executor-benchmark public 4 4 64 2048

      - name: Task-record storage reuse smoke (no timing threshold)
        shell: bash
        run: dub run --root=benchmarks/storage --build=release --compiler="$DC" --force -- 257 2 2 3 2

      - name: Public owned-storage and GC retention smoke (no timing threshold)
        shell: bash
        run: dub run --root=benchmarks/owned-storage --build=release --compiler="$DC" --force -- 64 2 1

      - name: End-to-end scheduler comparison smoke (no timing threshold)
        shell: bash
        run: |
          dub build --root=benchmarks/end-to-end --build=release --compiler="$DC" --force
          ./benchmarks/end-to-end/concurrency-end-to-end-benchmark 4 2 1 128 > /tmp/end-to-end.csv
          python3 tools/validation/summarize_m2_benchmark.py /tmp/end-to-end.csv > /dev/null

      - name: Adaptive range scheduling smoke (no timing threshold)
        shell: bash
        run: |
          dub build --root=benchmarks/adaptive-ranges --build=release --compiler="$DC" --force
          ./benchmarks/adaptive-ranges/concurrency-adaptive-ranges-benchmark 1 0 > /dev/null

      - name: Bounded streaming comparison smoke (no timing threshold)
        shell: bash
        run: |
          dub build --root=benchmarks/streaming --build=release --compiler="$DC" --force
          ./benchmarks/streaming/concurrency-streaming-benchmark 4 2 8 128 64 1 1 0 > /tmp/streaming.csv
          python3 tools/validation/summarize_streaming_benchmark.py /tmp/streaming.csv > /dev/null

      - name: Portable parking smoke and metrics (not a fixed performance gate)
        shell: bash
        run: dub run --root=benchmarks/parking --build=release --compiler="$DC" --force -- 2 64
