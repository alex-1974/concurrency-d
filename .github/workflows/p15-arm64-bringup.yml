name: P15 Native ARM64 Qualification

on:
  push:
    branches:
      - research/r0-1-work-stealing-deque
    paths:
      - ".github/workflows/p15-arm64-bringup.yml"
      - "research/r0_1_work_stealing_deque/probes/p15_native_aarch64/**"
      - "research/r0_1_work_stealing_deque/probes/p08e0_marked_top_batch/**"
      - "research/r0_1_work_stealing_deque/probes/p08e1_marked_top_concurrency/**"
      - "research/r0_1_work_stealing_deque/probes/p13b_distributed_production/**"
      - "research/r0_1_work_stealing_deque/probes/p14c_irregular_bursty/**"
      - "research/r0_1_work_stealing_deque/candidate/**"
  workflow_dispatch:

jobs:
  native-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host information
        run: |
          echo '=== COMMIT ==='
          git rev-parse HEAD

          echo
          echo '=== UNAME ==='
          uname -a
          uname -m

          echo
          echo '=== CPU ==='
          lscpu

          echo
          echo '=== OS ==='
          cat /etc/os-release

      - name: Verify native ARM64
        run: |
          ARCH="$(uname -m)"
          echo "architecture=$ARCH"

          if [ "$ARCH" != "aarch64" ] && [ "$ARCH" != "arm64" ]; then
            echo "ERROR: expected native ARM64 runner"
            false
          fi

      - name: Install LDC 1.41.0
        run: |
          curl -fsS \
            https://dlang.org/install.sh \
            -o /tmp/install-dlang.sh

          bash /tmp/install-dlang.sh \
            install ldc-1.41.0

          echo "$HOME/dlang/ldc-1.41.0/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          ldc2 --version
          dub --version

      - name: Core correctness
        working-directory: research/r0_1_work_stealing_deque/probes/p08e0_marked_top_batch
        run: |
          dub run \
            --compiler=ldc2 \
            --build=release \
            --force

      - name: Last-item race
        working-directory: research/r0_1_work_stealing_deque/probes/p15_native_aarch64/p15a_selected_last_item
        run: |
          dub run \
            --compiler=ldc2 \
            --build=release \
            --force

      - name: Multi-thief accounting
        working-directory: research/r0_1_work_stealing_deque/probes/p15_native_aarch64/p15b_selected_multi_thief
        run: |
          dub run \
            --compiler=ldc2 \
            --build=release \
            --force

      - name: Marked-top batch overlap
        working-directory: research/r0_1_work_stealing_deque/probes/p08e1_marked_top_concurrency
        run: |
          dub run \
            --compiler=ldc2 \
            --build=release \
            --force

      - name: Scheduler-like qualification
        working-directory: research/r0_1_work_stealing_deque/probes/p13b_distributed_production
        run: |
          dub run \
            --compiler=ldc2 \
            --build=release \
            --force

      - name: End-to-end scheduler workload
        working-directory: research/r0_1_work_stealing_deque/probes/p14c_irregular_bursty
        run: |
          dub run \
            --compiler=ldc2 \
            --build=release \
            --force
