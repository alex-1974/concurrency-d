  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifetime-probes:
    name: DIP1000 / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v7

      - name: Install pinned D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0

      - name: Language and compile-negative contract gate
        shell: bash
        run: bash tools/research/m1_lifetime_compile_probes.sh "$DC"

      - name: P01 scoped join prototype runtime (research only)
        shell: bash
        run: bash tools/research/m1_scoped_join_prototype.sh "$DC"

      - name: P02 lexical batch prototype runtime (research only)
        shell: bash
        run: bash tools/research/m1_lexical_batch_prototype.sh "$DC"

      - name: P03 bounded dynamic lexical scope (research only)
        shell: bash
        run: bash tools/research/m1_dynamic_scope_prototype.sh "$DC"

      - name: P04 @safe scalar-only external consumer (research only)
        shell: bash
        run: bash tools/research/m1_value_only_prototype.sh "$DC"

      - name: P06 partial-start and fatal-worker lifecycle (isolated research)
        shell: bash
        run: bash tools/research/m1_worker_lifecycle_probe.sh "$DC"

      - name: P07 native exceptional lifecycle fail-stop (isolated research)
        shell: bash
        run: bash tools/research/m1_native_lifecycle_failstop.sh "$DC"

      - name: P08 owned versus borrowed failure boundary (research only)
        shell: bash
        run: bash tools/research/m1_owned_vs_borrowed_prototype.sh "$DC"

      - name: P09 inline transfer and uncertainty supervisor (research only)
        shell: bash
        run: bash tools/research/m1_inline_transfer_and_uncertain.sh "$DC"

      - name: P10 typed inline TaskRef transport (research only)
        shell: bash
        run: bash tools/research/m1_typed_transport_prototype.sh "$DC"

      - name: P11 actual M0 work stealing typed task DUB consumer (research only)
        shell: bash
        run: bash tools/research/m1_real_pool_prototype.sh "$DC"

      - name: P19 real M0 owned GC graphs and handle independence
        shell: bash
        run: bash tools/research/m1_owned_gc_real_pool.sh "$DC"

      - name: P20 actual owned M0 early-stop fault injection (research only)
        shell: bash
        run: bash tools/research/m1_p20_owned_fault.sh "$DC"

      - name: P21 shutdown proof and ownership state contract (research only)
        shell: bash
        run: bash tools/research/m1_p21_shutdown_contract.sh "$DC"

      - name: P22 real native supervisor and coherent shutdown (research only)
        shell: bash
        run: bash tools/research/m1_p22_native_supervisor.sh "$DC"

      - name: P23 source-pinned real M0 deferred startup and uncertain shutdown
        shell: bash
        run: bash tools/research/m1_p23_real_m0_lifecycle.sh "$DC"

      - name: P24 explicit GC-root process registry on real M0 (research)
        shell: bash
        run: bash tools/research/m1_p24_root_registry.sh "$DC"

      - name: P25 scoped lifetime token vs process registry plus negative gates
        shell: bash
        run: bash tools/research/m1_p25_owner_modes.sh "$DC"

      - name: P26 token moves, exceptional unwind, registry release races
        shell: bash
        run: bash tools/research/m1_p26_token_registry.sh "$DC"

      - name: P27 real M0 register-start-submit-close-release race and process exit
        shell: bash
        run: bash tools/research/m1_p27_registry_transitions.sh "$DC"

      - name: P28 bounded orphan owner and explicit shutdown policy (real M0)
        shell: bash
        run: bash tools/research/m1_p28_bounded_orphans.sh "$DC"

      - name: P29 generational owner ABA and quota management (real M0)
        shell: bash
        run: bash tools/research/m1_p29_generational_owner.sh "$DC"

      - name: P30 original M0 versus deferred and P29 managed same-work correctness
        shell: bash
        run: bash tools/research/m1_p30_benchmark_probe.sh "$DC"

      - name: P12 paired matched M0 work-stealing benchmark (CI diagnostic only)
        shell: bash
        run: bash tools/research/m1_matched_pool_benchmark.sh "$DC"

      - name: P13 wave-wise real M0 scaling (CI correctness diagnostic only)
        shell: bash
        run: bash tools/research/m1_worker_scaling_probe.sh "$DC"

      - name: P14 exact M0 scheduler instrumentation and same-work control
        shell: bash
        run: bash tools/research/m1_p14_scheduler_trace.sh "$DC"

      - name: P15 exact M0 mutex acquisition and hold timing (research diagnostic)
        shell: bash
        run: bash tools/research/m1_p15_mutex_timing.sh "$DC"

      - name: P16 completion sampling with null-clock and untouched M0 control
        shell: bash
        run: bash tools/research/m1_p16_sampling_probe.sh "$DC"

      - name: P16.2 seq-cst completion race and uninstrumented M0 control
        shell: bash
        run: bash tools/research/m1_p16_2_probe.sh "$DC"

      - name: P17 original vs atomic scheduler event-path and thermal-monitor preflight
        shell: bash
        run: bash tools/research/m1_p17_probe.sh "$DC"

      - name: P18 exact-M0 bounded idle retry, race and same-work checks
        shell: bash
        run: bash tools/research/m1_p18_probe.sh "$DC"
